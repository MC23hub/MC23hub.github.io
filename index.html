<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MC23 HUB - Countdown</title>
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero">
        <img src="logo.png" alt="MC23hub logga">

        <p class="countdown-label">Släpps om:</p>
        <div class="countdown">
            <div class="time" id="time-days">
                <p id="days" class="time-text">00</p>
                <p class="time-label">Dagar</p>
            </div>
            <div class="time" id="time-hours">
                <p id="hours" class="time-text">00</p>
                <p class="time-label">Timmar</p>
            </div>
            <div class="time" id="time-minutes">
                <p id="minutes" class="time-text">00</p>
                <p class="time-label">Minuter</p>
            </div>
            <div class="time" id="time-seconds">
                <p id="seconds" class="time-text">00</p>
                <p class="time-label">Sekunder</p>
            </div>
        </div>

        <div id="update-now" style="display: none;">
            <p id="update-text">uppdatering pågång</p>
        </div>

        <p id="release-date">(20 Mars 18:00)</p>

        <div class="link-container">
            <p class="link-label">klicka här för att åka</p>
            <a href="https://dmaxb13.github.io/iSite" class="link">Vidare till gamla hemsidan</a>
        </div>
    </div>

    <script src="countdown.js"></script>
</body>
</html>
