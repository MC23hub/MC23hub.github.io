    <!-- /Navigator bar -->

<div class="member-container">

  <img src="/assets/logos/min sida.png" alt="Min sida" class="min-sida-logo">
  <p class="inloggad-som">Inloggad som:</p>
  <h2 id="account-name">error</h2>

  <h3>våran discord server,
dela inte länken med någon!</h3>
  <div class="links-container">
      <div class="link-box">
        <input type="text" class="link-name link1" value="https://discord.gg/SXHv4yWfvd" readonly>

        <button onclick="copyLink1()" class="visit">
          <p>KOPIERA</p>
        </button>
      </div>
  </div>
  <script>
    function copyLink1() {
      const input = document.querySelector('.link1');
      navigator.clipboard.writeText(input.value);
      
      alert("Kopierat!")
    }
  </script>

  <h3>skicka denna länk till en vän så kanske hen kommer med i servern</h3>
  <div class="links-container">
      <div class="link-box">
      <input type="text" class="link-name link2" value="inte färdig!" readonly>

        <button onclick="copyLink2()" class="visit">
          <p>KOPIERA</p>
        </button>
      </div>
  </div>
  <script>
    function copyLink2() {
      const input = document.querySelector('.link2');
      navigator.clipboard.writeText(input.value);

      alert("Kopierat!")
    }
  </script>

  <button id="logout-btn" style="margin-top:1.5rem">Logga ut</button>

  <div id="admin-link-wrap" style="display:none;margin-top:1rem">
    <a href="admin.html" class="btn">Go to Admin Panel</a>
  </div>
</div>


  <script type="module" src="/js/firebase-config.js"></script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module">
    import { onAuthChange, logoutUser, getUserData } from './js/auth.js';

    onAuthChange(async user => {
      if (!user) {
        window.location.href = '/login.html';
        return;
      }
      const data = await getUserData(user.uid);
      document.getElementById('loading-msg').style.display = 'none';
      document.getElementById('member-info').style.display = 'block';
      document.getElementById('account-name').innerHTML = `${data.username || user.email}`;

      if (data.minecraftUUID) {
        document.getElementById('mc-head').src =
          `https://minotar.net/helm/${data.minecraftUUID}/64`;
      }
      if (data.role === 'admin') {
        document.getElementById('admin-link-wrap').style.display = 'flex';
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await logoutUser();
      window.location.href = '/index.html';
    });
  </script>
</body>
</html>
